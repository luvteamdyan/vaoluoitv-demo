services:
  # VaoLuoiTV Frontend Application (Next.js)
  vaoluoi-frontend:
    image: devlee21/nextjs:latest
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED:-1}
      - PORT=${PORT:-8080}
      - HOSTNAME=${HOSTNAME:-0.0.0.0}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://vaoluoitv.com}
      - NEXT_PUBLIC_LIVE_URL=${NEXT_PUBLIC_LIVE_URL:-https://vl25.live}
      - NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
      - NEXT_PUBLIC_NEWS_API=${NEXT_PUBLIC_NEWS_API:-https://luck8event.com/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-https://api.vaoluoitv.com}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.vaoluoitv.com/api/v1}
      - NEXT_PUBLIC_SANITY_API_VERSION=${NEXT_PUBLIC_SANITY_API_VERSION:-2024-01-0}
      - NEXT_PUBLIC_SANITY_DATASET=${NEXT_PUBLIC_SANITY_DATASET:-production}
      - NEXT_PUBLIC_SANITY_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID}
    
    networks:
      - traefik-shared

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    
    restart: unless-stopped
    
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
      rollback_config:
        parallelism: 1
        delay: 5s
        monitor: 60s
        max_failure_ratio: 0.3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints: []
        preferences:
          - spread: node.id
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.vaoluoi-http.rule=Host(`vaoluoitv.net`) || Host(`www.vaoluoitv.net`)"
        - "traefik.http.routers.vaoluoi-http.entrypoints=web"
        - "traefik.http.routers.vaoluoi-http.middlewares=redirect-to-https"
        - "traefik.http.routers.vaoluoi-https.rule=Host(`vaoluoitv.net`) || Host(`www.vaoluoitv.net`)"
        - "traefik.http.routers.vaoluoi-https.entrypoints=websecure"
        - "traefik.http.routers.vaoluoi-https.tls.certresolver=letsencrypt"
        - "traefik.http.services.vaoluoi-frontend.loadbalancer.server.port=8080"
        - "traefik.docker.network=traefik-shared"
        - "traefik.http.services.vaoluoi-frontend.loadbalancer.healthcheck.path=/"
        - "traefik.http.services.vaoluoi-frontend.loadbalancer.healthcheck.interval=30s"
        - "traefik.http.services.vaoluoi-frontend.loadbalancer.healthcheck.timeout=10s"

networks:
  traefik-shared:
    external: true