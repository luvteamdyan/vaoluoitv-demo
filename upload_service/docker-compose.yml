services:
  vaoluoi-upload:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaoluoi-upload-service
    ports:
      - "3002:3002"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - UPLOAD_MAX_IMAGE_SIZE=${UPLOAD_MAX_IMAGE_SIZE}
      - UPLOAD_MAX_VIDEO_SIZE=${UPLOAD_MAX_VIDEO_SIZE}
      - UPLOAD_ALLOWED_TYPES=${UPLOAD_ALLOWED_TYPES}
      - UPLOAD_PATH=${UPLOAD_PATH}
      - CDN_BASE_URL=${CDN_BASE_URL}
      - CDN_SECRET_KEY=${CDN_SECRET_KEY}
      - API_KEY=${API_KEY}
      - LOG_LEVEL=info
    volumes:
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - vaoluoi-network

volumes:
  uploads_data:

networks:
  vaoluoi-network:
    driver: bridge
