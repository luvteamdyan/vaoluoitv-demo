listen              1935;
max_connections     1000;
srs_log_tank        file;
srs_log_file        ./objs/srs.log;
daemon              off;
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# HTTP hooks cho authentication
http_hooks {
    enabled         on;
    # Authentication khi publish (stream key validation)
    on_connect      ${BACKEND_API_URL}/api/v1/stream/validate;
    on_publish      ${BACKEND_API_URL}/api/v1/stream/validate;
    # Authentication khi play (validate signed URL và match status)
    on_play         ${BACKEND_API_URL}/api/v1/stream/play-validate;
    # Events tracking
    on_unpublish    ${BACKEND_API_URL}/api/v1/stream/event;
    on_stop         ${BACKEND_API_URL}/api/v1/stream/event;
}

vhost __defaultVhost__ {
    # Cấu hình cho low latency
    min_latency     on;
    tcp_nodelay     on;
    
    # RTMP publish configuration
    publish {
        mr              off;
        mr_latency      100;
        firstpkt_timeout 5000;
        normal_timeout  3000;
        parse_sps       on;
        try_annexb_first on;
    }
    
    # Play configuration cho low latency
    play {
        gop_cache       off;
        queue_length    5;
        time_jitter     off;
        atc             off;
        mix_correct     off;
        mw_latency      100;
        mw_msgs         1;
    }
    
    # HTTP-FLV configuration
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
        hstrs       on;
    }
    
    # HLS configuration (Low Latency HLS)
    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      10;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        
        # Low Latency HLS settings
        hls_ts_floor    off;
        hls_acodec      aac;
        hls_vcodec      h264;
        hls_cleanup     on;
        hls_dispose     30;
        hls_wait_keyframe on;
        
        # LL-HLS specific settings
        hls_keys        on;
        hls_fragments_per_key 5;
        hls_dts_directly off;
    }
    
    # Security và bandwidth management
    security {
        enabled         on;
        seo_switch      on;
        allow_publish   all;
        allow_play      all;
    }
    
    # Transcode configuration (nếu cần multiple bitrates)
    transcode {
        enabled     off;
        ffmpeg      ./objs/ffmpeg/bin/ffmpeg;
        
        engine live {
            enabled         off;
            vfilter {
                v               quiet;
                vf              scale=1280:720;
            }
            vcodec          libx264;
            vbitrate        1500;
            vfps            25;
            vwidth          1280;
            vheight         720;
            vthreads        2;
            vprofile        baseline;
            vpreset         ultrafast;
            acodec          aac;
            abitrate        128;
            asample_rate    44100;
            achannels       2;
            output          rtmp://127.0.0.1:[port]/[app]?vhost=[vhost]/[stream]_[engine];
        }
    }
}

# Stats configuration
stats {
    network         0;
    disk            sda sdb xvda xvdb;
}