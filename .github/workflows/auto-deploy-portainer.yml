name: Stack Deploy with Portainer API

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy all services (ignore change detection)'
        required: false
        type: boolean
        default: false

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: devlee21

jobs:
  # Detect changes in services
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # Service change flags
      api-gateway-changed: ${{ steps.changes.outputs.api-gateway }}
      secure-api-service-changed: ${{ steps.changes.outputs.secure-api-service }}
      upload-service-changed: ${{ steps.changes.outputs.upload-service }}
      crawler-worker-service-changed: ${{ steps.changes.outputs.crawler-worker-service }}
      game-service-changed: ${{ steps.changes.outputs.game-service }}
      admin-dashboard-changed: ${{ steps.changes.outputs.admin-dashboard }}
      studio-sanity-changed: ${{ steps.changes.outputs.studio-sanity }}
      minigames-fe-changed: ${{ steps.changes.outputs.minigames-fe }}
      nextjs-changed: ${{ steps.changes.outputs.nextjs }}
      
      # Action type
      action-type: ${{ steps.set-matrix.outputs.action-type }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Detect changes in services
        id: changes
        uses: dorny/paths-filter@v2
        with:
          base: ${{ github.event.before || 'HEAD~1' }}
          filters: |
            api-gateway:
              - 'api_gateway/**'
            secure-api-service:
              - 'secure_api_service/**'
            upload-service:
              - 'upload_service/**'
            crawler-worker-service:
              - 'crawler_worker_service/**'
            game-service:
              - 'game_service/**'
            admin-dashboard:
              - 'admin-dashboard/**'
            studio-sanity:
              - 'studio-sanity/**'
            minigames-fe:
              - 'minigames_fe/**'
            nextjs:
              - 'nextjs/**'

      - name: Set action type
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.force_deploy }}" == "true" ]; then
            echo "action-type=force_deploy" >> $GITHUB_OUTPUT
          else
            # Check if any service changed
            CHANGED_SERVICES=0
            if [ "${{ steps.changes.outputs.api-gateway }}" == "true" ]; then CHANGED_SERVICES=$((CHANGED_SERVICES + 1)); fi
            if [ "${{ steps.changes.outputs.secure-api-service }}" == "true" ]; then CHANGED_SERVICES=$((CHANGED_SERVICES + 1)); fi
            if [ "${{ steps.changes.outputs.upload-service }}" == "true" ]; then CHANGED_SERVICES=$((CHANGED_SERVICES + 1)); fi
            if [ "${{ steps.changes.outputs.crawler-worker-service }}" == "true" ]; then CHANGED_SERVICES=$((CHANGED_SERVICES + 1)); fi
            if [ "${{ steps.changes.outputs.game-service }}" == "true" ]; then CHANGED_SERVICES=$((CHANGED_SERVICES + 1)); fi
            if [ "${{ steps.changes.outputs.admin-dashboard }}" == "true" ]; then CHANGED_SERVICES=$((CHANGED_SERVICES + 1)); fi
            if [ "${{ steps.changes.outputs.studio-sanity }}" == "true" ]; then CHANGED_SERVICES=$((CHANGED_SERVICES + 1)); fi
            if [ "${{ steps.changes.outputs.minigames-fe }}" == "true" ]; then CHANGED_SERVICES=$((CHANGED_SERVICES + 1)); fi
            if [ "${{ steps.changes.outputs.nextjs }}" == "true" ]; then CHANGED_SERVICES=$((CHANGED_SERVICES + 1)); fi
            
            if [ $CHANGED_SERVICES -gt 0 ]; then
              echo "action-type=auto_deploy" >> $GITHUB_OUTPUT
            else
              echo "action-type=skip_deploy" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Show change detection results
        run: |
          echo "### 🔍 Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service Changes:**" >> $GITHUB_STEP_SUMMARY
          echo "- API Gateway: ${{ steps.changes.outputs.api-gateway }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secure API Service: ${{ steps.changes.outputs.secure-api-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- Upload Service: ${{ steps.changes.outputs.upload-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- Crawler Worker Service: ${{ steps.changes.outputs.crawler-worker-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- Game Service: ${{ steps.changes.outputs.game-service }}" >> $GITHUB_STEP_SUMMARY
          echo "- Admin Dashboard: ${{ steps.changes.outputs.admin-dashboard }}" >> $GITHUB_STEP_SUMMARY
          echo "- Studio Sanity: ${{ steps.changes.outputs.studio-sanity }}" >> $GITHUB_STEP_SUMMARY
          echo "- Minigames FE: ${{ steps.changes.outputs.minigames-fe }}" >> $GITHUB_STEP_SUMMARY
          echo "- NextJS: ${{ steps.changes.outputs.nextjs }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action Type:** ${{ steps.set-matrix.outputs.action-type }}" >> $GITHUB_STEP_SUMMARY

  # Skip build for testing - only redeploy
  skip-build:
    needs: detect-changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Skip build notification
        run: |
          echo "### ⏭️ Build Skipped for Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build step temporarily disabled for Portainer Stack API testing" >> $GITHUB_STEP_SUMMARY
          echo "**Action type:** ${{ needs.detect-changes.outputs.action-type }}" >> $GITHUB_STEP_SUMMARY

  # Deploy using Portainer Stack API
  deploy-stack:
    needs: [detect-changes, skip-build]
    if: |
      always() && 
      (needs.detect-changes.outputs.action-type == 'auto_deploy' || 
       needs.detect-changes.outputs.action-type == 'force_deploy') &&
      (needs.detect-changes.result == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Deploy stack with Portainer API
        id: deploy
        run: |
          set -e
          
          echo "🚀 Starting Portainer Stack deployment..."
          echo "Action type: ${{ needs.detect-changes.outputs.action-type }}"
          
          # Test Portainer API connection first
          echo "🔍 Testing Portainer API connection..."
          API_TEST=$(curl -s -w "%{http_code}" -o /tmp/api_test.json \
            "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
          
          echo "API Test HTTP Code: $API_TEST"
          if [ "$API_TEST" -ne 200 ]; then
            echo "❌ Portainer API connection failed!"
            echo "Response:"
            cat /tmp/api_test.json
            exit 1
          fi
          echo "✅ Portainer API connection successful"
          
          # Get stack information
          echo "📋 Getting stack information..."
          STACKS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/stacks.json \
            "${{ secrets.PORTAINER_URL }}/api/stacks" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
          
          echo "Stacks API HTTP Code: $STACKS_RESPONSE"
          
          if [ "$STACKS_RESPONSE" -ne 200 ]; then
            echo "❌ Failed to get stacks list!"
            echo "Response:"
            cat /tmp/stacks.json
            exit 1
          fi
          
          # Find the vaoluoitv stack
          STACK_ID=$(cat /tmp/stacks.json | jq -r '.[] | select(.Name == "vaoluoitv") | .Id')
          
          if [ -z "$STACK_ID" ] || [ "$STACK_ID" == "null" ]; then
            echo "❌ Stack 'vaoluoitv' not found!"
            echo "Available stacks:"
            cat /tmp/stacks.json | jq -r '.[] | .Name'
            exit 1
          fi
          
          echo "✅ Found stack 'vaoluoitv' with ID: $STACK_ID"
          
          # Get stack details
          echo "📋 Getting stack details..."
          STACK_DETAILS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/stack_details.json \
            "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
          
          echo "Stack Details HTTP Code: $STACK_DETAILS_RESPONSE"
          
          if [ "$STACK_DETAILS_RESPONSE" -ne 200 ]; then
            echo "❌ Failed to get stack details!"
            echo "Response:"
            cat /tmp/stack_details.json
            exit 1
          fi
          
          # Check stack type and update accordingly
          echo "🔍 Checking stack type and structure..."
          STACK_DETAILS=$(cat /tmp/stack_details.json)
          STACK_TYPE=$(echo "$STACK_DETAILS" | jq -r '.Type')
          echo "📋 Stack type: $STACK_TYPE"
          
          # Debug: Show stack structure
          echo "🔍 Stack structure:"
          echo "$STACK_DETAILS" | jq -r 'keys[]' | head -10
          
          # Check if it's a Git-based stack (EntryPoint) or file-based stack
          if echo "$STACK_DETAILS" | jq -e '.GitConfig' > /dev/null && [ "$(echo "$STACK_DETAILS" | jq -r '.GitConfig')" != "null" ]; then
            echo "✅ Stack is Git-based (EntryPoint)"
            GIT_CONFIG=$(echo "$STACK_DETAILS" | jq -r '.GitConfig')
            echo "📋 Git Config: $GIT_CONFIG"
            STACK_METHOD="git"
          elif echo "$STACK_DETAILS" | jq -e '.StackFileContent' > /dev/null && [ "$(echo "$STACK_DETAILS" | jq -r '.StackFileContent')" != "null" ]; then
            echo "✅ Stack has StackFileContent (file-based)"
            COMPOSE_LENGTH=$(echo "$STACK_DETAILS" | jq -r '.StackFileContent' | wc -c)
            echo "📏 Compose file length: $COMPOSE_LENGTH characters"
            STACK_METHOD="file"
          else
            echo "❌ Stack does not have valid GitConfig or StackFileContent"
            echo "🔍 Available fields:"
            echo "$STACK_DETAILS" | jq -r 'keys[]'
            echo "🔍 GitConfig value: $(echo "$STACK_DETAILS" | jq -r '.GitConfig // "null"')"
            echo "🔍 StackFileContent value: $(echo "$STACK_DETAILS" | jq -r '.StackFileContent // "null"')"
            
            # Try to determine method from stack type and other fields
            if echo "$STACK_DETAILS" | jq -e '.GitConfig' > /dev/null && [ "$(echo "$STACK_DETAILS" | jq -r '.GitConfig')" != "null" ] && [ "$(echo "$STACK_DETAILS" | jq -r '.GitConfig')" != "{}" ]; then
              echo "✅ Found valid GitConfig - treating as Git-based stack"
              STACK_METHOD="git"
            elif echo "$STACK_DETAILS" | jq -e '.EntryPoint' > /dev/null && [ "$(echo "$STACK_DETAILS" | jq -r '.EntryPoint')" != "null" ]; then
              echo "⚠️ Found EntryPoint but GitConfig is null/empty - checking if it's a template-based stack"
              
              # Check if it's a template-based stack
              if echo "$STACK_DETAILS" | jq -e '.FromAppTemplate' > /dev/null && [ "$(echo "$STACK_DETAILS" | jq -r '.FromAppTemplate')" == "true" ]; then
                echo "✅ This is a template-based stack - treating as file-based for updates"
                STACK_METHOD="file"
              else
                echo "⚠️ Unknown stack type with EntryPoint - defaulting to file-based"
                STACK_METHOD="file"
              fi
            else
              echo "❌ Cannot determine stack method - defaulting to file-based"
              STACK_METHOD="file"
            fi
          fi
          
          # Update stack based on detected method
          if [ "$STACK_METHOD" == "git" ]; then
            echo "🔄 Updating Git-based stack (EntryPoint)..."
            
            # For Git-based stacks, we trigger a pull and redeploy
            # This will pull the latest changes from the Git repository
            UPDATE_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/update_response.json -X PUT \
              "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID/git/redeploy?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
              -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
          else
            echo "🔄 Updating file-based/template-based stack..."
            
            # First, try to pull latest images for all containers in the stack
            echo "📋 Pulling latest images for all containers..."
            
            # Get containers in the stack
            STACK_NAME=$(echo "$STACK_DETAILS" | jq -r '.Name')
            CONTAINERS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/stack_containers.json \
              "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/json?all=true&filters=%7B%22label%22%3A%5B%22com.docker.compose.project%3D$STACK_NAME%22%5D%7D" \
              -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
            
            if [ "$CONTAINERS_RESPONSE" -eq 200 ]; then
              CONTAINERS_JSON=$(cat /tmp/stack_containers.json)
              
              # Extract unique image names from containers
              IMAGE_NAMES=$(echo "$CONTAINERS_JSON" | jq -r '.[] | .Image' | sort -u)
              
              for IMAGE in $IMAGE_NAMES; do
                if [ "$IMAGE" != "null" ] && [ -n "$IMAGE" ]; then
                  echo "🔄 Pulling image: $IMAGE"
                  PULL_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/pull_${IMAGE//\//_}.json -X POST \
                    "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/images/create?fromImage=$IMAGE" \
                    -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
                  
                  if [ "$PULL_RESPONSE" -ge 200 ] && [ "$PULL_RESPONSE" -lt 300 ]; then
                    echo "✅ Successfully pulled: $IMAGE"
                  else
                    echo "⚠️ Failed to pull: $IMAGE (HTTP: $PULL_RESPONSE)"
                  fi
                fi
              done
            fi
            
            # Try to restart the stack by recreating containers
            echo "🔄 Restarting stack containers..."
            
            # Restart all containers in the stack
            if [ "$CONTAINERS_RESPONSE" -eq 200 ]; then
              CONTAINER_IDS=$(echo "$CONTAINERS_JSON" | jq -r '.[] | .Id')
              
              for CONTAINER_ID in $CONTAINER_IDS; do
                if [ "$CONTAINER_ID" != "null" ] && [ -n "$CONTAINER_ID" ]; then
                  echo "🔄 Restarting container: $CONTAINER_ID"
                  
                  # Stop container
                  STOP_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/stop_${CONTAINER_ID}.json -X POST \
                    "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/$CONTAINER_ID/stop?t=30" \
                    -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
                  
                  # Start container
                  START_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/start_${CONTAINER_ID}.json -X POST \
                    "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/$CONTAINER_ID/start" \
                    -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
                  
                  if [ "$START_RESPONSE" -ge 200 ] && [ "$START_RESPONSE" -lt 300 ]; then
                    echo "✅ Successfully restarted container: $CONTAINER_ID"
                  else
                    echo "⚠️ Failed to restart container: $CONTAINER_ID (HTTP: $START_RESPONSE)"
                  fi
                fi
              done
              
              UPDATE_RESPONSE=200
              echo "✅ Stack containers restarted successfully"
            else
              echo "⚠️ Could not get container list, trying alternative approach..."
              
              # Fallback: try to get and update compose content if available
              if echo "$STACK_DETAILS" | jq -e '.StackFileContent' > /dev/null && [ "$(echo "$STACK_DETAILS" | jq -r '.StackFileContent')" != "null" ]; then
                STACK_COMPOSE_FILE=$(echo "$STACK_DETAILS" | jq -r '.StackFileContent')
                
                # Create temporary file for JSON payload
                echo '{"StackFileContent":' > /tmp/update_payload.json
                echo "$STACK_COMPOSE_FILE" | jq -R -s . >> /tmp/update_payload.json
                echo ',"Prune":true}' >> /tmp/update_payload.json
                
                echo "📋 Payload prepared, updating stack..."
                
                # Update stack
                UPDATE_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/update_response.json -X PUT \
                  "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
                  -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/update_payload.json)
              else
                echo "❌ No compose content available for update"
                UPDATE_RESPONSE=500
              fi
            fi
          fi
          
          echo "Stack Update HTTP Code: $UPDATE_RESPONSE"
          
          if [ "$UPDATE_RESPONSE" -ge 200 ] && [ "$UPDATE_RESPONSE" -lt 300 ]; then
            echo "✅ Stack updated successfully!"
            echo "🔄 All containers will be recreated with latest images"
            DEPLOYMENT_RESULTS=("Stack:SUCCESS")
          else
            echo "❌ Failed to update stack!"
            echo "Response:"
            cat /tmp/update_response.json
            
            # Try alternative approach - recreate stack
            echo "🔄 Trying alternative approach - recreating stack..."
            
            # Get current stack details
            STACK_NAME=$(echo "$STACK_DETAILS" | jq -r '.Name')
            STACK_ENV=$(echo "$STACK_DETAILS" | jq -r '.Env // []')
            
            # Check if it's a Git-based stack
            if [ "$STACK_METHOD" == "git" ]; then
              echo "🔄 Recreating Git-based stack..."
              
              # For Git-based stacks, we need to extract Git configuration
              GIT_CONFIG=$(echo "$STACK_DETAILS" | jq -r '.GitConfig')
              echo "📋 Git Config for recreation: $GIT_CONFIG"
              
              # Delete and recreate Git-based stack
              echo "🗑️ Deleting current Git-based stack..."
              DELETE_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/delete_response.json -X DELETE \
                "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
                -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
              
              echo "Delete HTTP Code: $DELETE_RESPONSE"
              
              if [ "$DELETE_RESPONSE" -ge 200 ] && [ "$DELETE_RESPONSE" -lt 300 ]; then
                echo "✅ Git-based stack deleted successfully"
                
                # Wait a moment
                sleep 5
                
                # Recreate Git-based stack
                echo "🔄 Recreating Git-based stack..."
                echo '{"Name":"'$STACK_NAME'","GitConfig":'$GIT_CONFIG',"Env":'$STACK_ENV'}' > /tmp/recreate_payload.json
                
                RECREATE_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/recreate_response.json -X POST \
                  "${{ secrets.PORTAINER_URL }}/api/stacks?type=1&method=repository&endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
                  -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/recreate_payload.json)
                
                echo "Recreate HTTP Code: $RECREATE_RESPONSE"
                
                if [ "$RECREATE_RESPONSE" -ge 200 ] && [ "$RECREATE_RESPONSE" -lt 300 ]; then
                  echo "✅ Git-based stack recreated successfully!"
                  DEPLOYMENT_RESULTS=("Stack:RECREATED")
                else
                  echo "❌ Failed to recreate Git-based stack!"
                  echo "Response:"
                  cat /tmp/recreate_response.json
                  DEPLOYMENT_RESULTS=("Stack:FAILED")
                fi
              else
                echo "❌ Failed to delete Git-based stack!"
                echo "Response:"
                cat /tmp/delete_response.json
                DEPLOYMENT_RESULTS=("Stack:FAILED")
              fi
            else
              echo "🔄 Recreating file-based stack..."
              
              # For file-based stacks, use the original approach
              # Delete and recreate stack
              echo "🗑️ Deleting current file-based stack..."
              DELETE_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/delete_response.json -X DELETE \
                "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
                -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
              
              echo "Delete HTTP Code: $DELETE_RESPONSE"
              
              if [ "$DELETE_RESPONSE" -ge 200 ] && [ "$DELETE_RESPONSE" -lt 300 ]; then
                echo "✅ File-based stack deleted successfully"
                
                # Wait a moment
                sleep 5
                
                # Recreate file-based stack
                echo "🔄 Recreating file-based stack..."
                echo '{"Name":"'$STACK_NAME'","StackFileContent":' > /tmp/recreate_payload.json
                echo "$STACK_COMPOSE_FILE" | jq -R -s . >> /tmp/recreate_payload.json
                echo ',"Env":'$STACK_ENV'}' >> /tmp/recreate_payload.json
                
                RECREATE_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/recreate_response.json -X POST \
                  "${{ secrets.PORTAINER_URL }}/api/stacks?type=1&method=string&endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
                  -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
                  -H "Content-Type: application/json" \
                  -d @/tmp/recreate_payload.json)
                
                echo "Recreate HTTP Code: $RECREATE_RESPONSE"
                
                if [ "$RECREATE_RESPONSE" -ge 200 ] && [ "$RECREATE_RESPONSE" -lt 300 ]; then
                  echo "✅ File-based stack recreated successfully!"
                  DEPLOYMENT_RESULTS=("Stack:RECREATED")
                else
                  echo "❌ Failed to recreate file-based stack!"
                  echo "Response:"
                  cat /tmp/recreate_response.json
                  DEPLOYMENT_RESULTS=("Stack:FAILED")
                fi
              else
                echo "❌ Failed to delete file-based stack!"
                echo "Response:"
                cat /tmp/delete_response.json
                DEPLOYMENT_RESULTS=("Stack:FAILED")
              fi
            fi
          fi
          
          # Wait for containers to be recreated
          echo "⏳ Waiting for containers to be recreated..."
          sleep 30
          
          # Check container status
          echo "🔍 Checking container status..."
          CONTAINERS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/containers.json \
            "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/json?all=true" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
          
          if [ "$CONTAINERS_RESPONSE" -eq 200 ]; then
            CONTAINERS_JSON=$(cat /tmp/containers.json)
            echo "📊 Current containers:"
            echo "$CONTAINERS_JSON" | jq -r '.[] | select(.Names[] | contains("-prod")) | {Names: .Names, State: .State}' | head -10
          fi
          
          echo ""
          echo "🎉 Stack deployment completed!"
          echo "📊 Results:"
          for result in "${DEPLOYMENT_RESULTS[@]}"; do
            echo "  - $result"
          done
          
          # Set output for summary
          echo "deployment_results=${DEPLOYMENT_RESULTS[*]}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: success()
        run: |
          echo "### 🎉 Stack Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Stack:** vaoluoitv" >> $GITHUB_STEP_SUMMARY
          echo "**Action type:** ${{ needs.detect-changes.outputs.action-type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Results:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deploy.outputs.deployment_results }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Method:** Portainer Stack API (Git-based EntryPoint or File-based)" >> $GITHUB_STEP_SUMMARY
          echo "**Result:** All containers recreated with latest images" >> $GITHUB_STEP_SUMMARY
          
      - name: Deployment failed summary
        if: failure()
        run: |
          echo "### ❌ Stack Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs for more details." >> $GITHUB_STEP_SUMMARY
          echo "**Action type:** ${{ needs.detect-changes.outputs.action-type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # Skip deployment notification
  skip-deployment:
    needs: detect-changes
    if: needs.detect-changes.outputs.action-type == 'skip_deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Skip deployment notification
        run: |
          echo "### ⏭️ Deployment Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No service changes detected - skipping deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ Only workflow files or other non-service files were changed." >> $GITHUB_STEP_SUMMARY
