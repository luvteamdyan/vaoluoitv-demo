name: Portainer CE Deploy Pipeline

on:
  push:
    branches:
      - gitops-test
  pull_request:
    branches:
      - gitops-test

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: dyanle/vaoluoi-frontend
  COMPOSE_FILE: docker-compose.yml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate image tag
        id: image_tag
        run: |
          # Tạo tag đơn giản dựa trên commit SHA
          TAG="${{ github.ref_name }}-${{ github.sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update docker-compose.yml
        run: |
          # Hiển thị nội dung hiện tại
          echo "Current docker-compose.yml content:"
          grep "image:" ${{ env.COMPOSE_FILE }} || true
          
          # Cập nhật image tag trong docker-compose.yml
          sed -i "s|image: dyanle/vaoluoi-frontend:.*|image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}|g" ${{ env.COMPOSE_FILE }}
          
          # Hiển thị nội dung sau khi cập nhật
          echo "Updated docker-compose.yml content:"
          grep "image:" ${{ env.COMPOSE_FILE }} || true
          
          echo "✅ Updated docker-compose.yml with tag: ${{ steps.image_tag.outputs.tag }}"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push changes
        run: |
          # Kiểm tra có thay đổi không
          if git diff --quiet ${{ env.COMPOSE_FILE }}; then
            echo "⚠️ No changes detected in docker-compose.yml"
            echo "Current image tag might already be up to date"
          else
            echo "📝 Changes detected, committing..."
            git add ${{ env.COMPOSE_FILE }}
            git commit -m "🚀 Auto-update image tag to ${{ steps.image_tag.outputs.tag }} [skip ci]"
            git push origin ${{ github.ref_name }}
            echo "✅ Successfully pushed updated docker-compose.yml"
          fi

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.image_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Portainer GitOps will now redeploy the stack automatically." >> $GITHUB_STEP_SUMMARY
