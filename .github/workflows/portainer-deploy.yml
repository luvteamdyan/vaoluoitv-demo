name: Portainer CE Deploy Pipeline

on:
  push:
    branches:
      - gitops-test
  pull_request:
    branches:
      - gitops-test

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: dyanle/vaoluoi-frontend
  COMPOSE_FILE: docker-compose.yml
  STACK_NAME: vaoluoitv-test
  SERVICE_NAME: vaoluoi-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate image tag
        id: image_tag
        run: |
          # Tạo tag đơn giản dựa trên commit SHA
          TAG="${{ github.ref_name }}-${{ github.sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update docker-compose.yml
        run: |
          # Hiển thị nội dung hiện tại
          echo "Current docker-compose.yml content:"
          grep "image:" ${{ env.COMPOSE_FILE }} || true
          
          # Cập nhật image tag trong docker-compose.yml
          sed -i "s|image: dyanle/vaoluoi-frontend:.*|image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}|g" ${{ env.COMPOSE_FILE }}
          
          # Hiển thị nội dung sau khi cập nhật
          echo "Updated docker-compose.yml content:"
          grep "image:" ${{ env.COMPOSE_FILE }} || true
          
          echo "✅ Updated docker-compose.yml with tag: ${{ steps.image_tag.outputs.tag }}"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Trigger deployment via Deploy Agent
        run: |
          # Gọi deploy agent để update service
          DEPLOY_URL="${{ secrets.DEPLOY_AGENT_URL || 'https://deploy-agent.yourdomain.com' }}"
          IMAGE_FULL_NAME="${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}"
          
          echo "🚀 Triggering deployment via Deploy Agent..."
          echo "Agent URL: $DEPLOY_URL"
          echo "Image: $IMAGE_FULL_NAME"
          
          # Test agent health first with better error handling
          echo "🔍 Checking agent health..."
          
          # Try health check with verbose output for debugging
          echo "Attempting health check with User-Agent and verbose output..."
          HEALTH_RESPONSE=$(curl -s -w "%{http_code}" \
            -H "User-Agent: GitHub-Actions-Deploy/1.0" \
            -H "Accept: application/json" \
            --max-time 30 \
            "$DEPLOY_URL/health" || echo "000")
          HTTP_CODE="${HEALTH_RESPONSE: -3}"
          RESPONSE_BODY="${HEALTH_RESPONSE%???}"
          
          echo "Health check HTTP code: $HTTP_CODE"
          echo "Response body preview: ${RESPONSE_BODY:0:200}..."
          
          # Check if it's Cloudflare challenge (Under Attack Mode)
          if [[ "$RESPONSE_BODY" == *"challenge-platform"* ]] || [[ "$RESPONSE_BODY" == *"Just a moment"* ]]; then
            echo "⚠️  Cloudflare Under Attack Mode detected - bypassing health check"
            echo "This is likely Cloudflare's security challenge blocking automated requests"
            echo "Proceeding with deployment (agent should be reachable via internal network)"
          elif [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Agent health check passed"
          else
            echo "❌ Agent health check failed with HTTP $HTTP_CODE"
            echo "Response: $RESPONSE_BODY"
            echo "⚠️  Health check failed but proceeding with deployment"
            echo "This may be due to Cloudflare protection or network restrictions"
          fi
          
          # Trigger deployment with better error handling
          echo "🚀 Triggering deployment..."
          DEPLOY_RESPONSE=$(curl -s -w "%{http_code}" -X POST "$DEPLOY_URL/deploy" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-Deploy/1.0" \
            -H "Accept: application/json" \
            -d '{
              "stack": "${{ env.STACK_NAME }}",
              "service": "${{ env.SERVICE_NAME }}",
              "image": "'$IMAGE_FULL_NAME'",
              "token": "${{ secrets.AGENT_TOKEN }}"
            }' \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 || echo "000")
          
          DEPLOY_HTTP_CODE="${DEPLOY_RESPONSE: -3}"
          DEPLOY_BODY="${DEPLOY_RESPONSE%???}"
          
          echo "Deploy HTTP code: $DEPLOY_HTTP_CODE"
          echo "Deploy response: $DEPLOY_BODY"
          
          # Check if it's Cloudflare challenge on deploy endpoint too
          if [[ "$DEPLOY_BODY" == *"challenge-platform"* ]] || [[ "$DEPLOY_BODY" == *"Just a moment"* ]]; then
            echo "❌ Deployment blocked by Cloudflare Under Attack Mode"
            echo "The deploy endpoint is also protected by Cloudflare's security challenge"
            echo "Solutions:"
            echo "1. Disable Cloudflare 'Under Attack Mode' temporarily"
            echo "2. Add GitHub Actions IP ranges to Cloudflare IP Access Rules allowlist"
            echo "3. Use Cloudflare API to bypass for specific paths (/health, /deploy)"
            echo "4. Configure internal/VPN access for deployment"
            exit 1
          elif [ "$DEPLOY_HTTP_CODE" = "200" ]; then
            echo "✅ Deployment triggered successfully"
            echo "Response: $DEPLOY_BODY"
          else
            echo "❌ Deployment failed with HTTP $DEPLOY_HTTP_CODE"
            echo "Response: $DEPLOY_BODY"
            echo "Please check:"
            echo "1. AGENT_TOKEN secret is set correctly"
            echo "2. Stack and service names are valid"
            echo "3. Docker image is accessible"
            echo "4. Cloudflare security settings"
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.image_tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Portainer GitOps will now redeploy the stack automatically." >> $GITHUB_STEP_SUMMARY
