name: Test Upload Service Redeploy

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  test-upload-redeploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Test Upload Service Redeploy
        run: |
          set -e
          
          echo "🚀 Testing Upload Service Redeploy..."
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          
          # Check if this workflow file was changed to trigger redeploy
          echo "🔍 Checking if workflow files were changed..."
          if [ "${{ github.event_name }}" == "push" ]; then
            # Get changed files in this commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "Changed files: $CHANGED_FILES"
            
            # Check if any workflow files were changed
            if echo "$CHANGED_FILES" | grep -q "\.github/workflows/"; then
              echo "✅ Workflow files were changed - triggering upload_service redeploy test"
            else
              echo "ℹ️ No workflow files changed - simulating upload_service change"
            fi
          else
            # For manual trigger, always test
            echo "ℹ️ Manual trigger - testing upload_service redeploy"
          fi
          
          # Test Portainer API connection first
          echo "🔍 Testing Portainer API connection..."
          API_TEST=$(curl -s -w "%{http_code}" -o /tmp/api_test.json \
            "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
          
          echo "API Test HTTP Code: $API_TEST"
          if [ "$API_TEST" -ne 200 ]; then
            echo "❌ Portainer API connection failed!"
            echo "Response:"
            cat /tmp/api_test.json
            exit 1
          fi
          echo "✅ Portainer API connection successful"
          
          # Get current containers
          echo "📋 Getting current containers..."
          CONTAINERS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/containers.json \
            "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/json?all=true" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
          
          if [ "$CONTAINERS_RESPONSE" -ne 200 ]; then
            echo "❌ Failed to get containers list!"
            echo "Response:"
            cat /tmp/containers.json
            exit 1
          fi
          
          echo "✅ Containers list retrieved"
          CONTAINERS_JSON=$(cat /tmp/containers.json)
          
          # Test specific service: upload_service
          SERVICE="upload_service"
          CONTAINER_PATTERN="upload_service-prod"
          IMAGE_NAME="devlee21/upload_service"
          
          echo ""
          echo "🔄 Testing service: $SERVICE"
          echo "Looking for container pattern: $CONTAINER_PATTERN"
          
          # Show all available containers for debugging
          echo "📋 All available containers:"
          echo "$CONTAINERS_JSON" | jq -r '.[] | {Names: .Names, Id: .Id}' 2>/dev/null || echo "Failed to parse containers"
          
          # Find container ID
          CONTAINER_ID=$(echo "$CONTAINERS_JSON" | jq -r ".[] | select(.Names[] | contains(\"$CONTAINER_PATTERN\")) | .Id" 2>/dev/null || echo "")
          
          if [ -z "$CONTAINER_ID" ] || [ "$CONTAINER_ID" == "null" ]; then
            echo "⚠️ Container for $SERVICE not found (pattern: $CONTAINER_PATTERN)"
            echo ""
            echo "🔍 Let's check what containers contain 'upload':"
            echo "$CONTAINERS_JSON" | jq -r '.[] | select(.Names[] | contains("upload")) | {Names: .Names, Id: .Id}' 2>/dev/null || echo "No containers with 'upload' found"
            echo ""
            echo "🔍 Let's check what containers contain 'prod':"
            echo "$CONTAINERS_JSON" | jq -r '.[] | select(.Names[] | contains("prod")) | {Names: .Names, Id: .Id}' 2>/dev/null || echo "No containers with 'prod' found"
            exit 1
          fi
          
          echo "✅ Found container: $CONTAINER_ID"
          
          # Get container details
          echo "📋 Getting container details..."
          CONTAINER_DETAILS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/container_details.json \
            "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/$CONTAINER_ID/json" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
          
          if [ "$CONTAINER_DETAILS_RESPONSE" -eq 200 ]; then
            CONTAINER_DETAILS=$(cat /tmp/container_details.json)
            CURRENT_IMAGE=$(echo "$CONTAINER_DETAILS" | jq -r '.Config.Image')
            echo "✅ Container details retrieved"
            echo "Current image: $CURRENT_IMAGE"
          else
            echo "⚠️ Failed to get container details (HTTP: $CONTAINER_DETAILS_RESPONSE)"
          fi
          
            # Manual recreation flow for Portainer CE (no recreate API)
            echo "🔄 Starting manual recreation flow for Portainer CE..."
            
            # Step 1: Get container configuration
            echo "📋 Step 1: Getting container configuration..."
            CONTAINER_DETAILS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/container_details.json \
              "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/$CONTAINER_ID/json" \
              -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
            
            if [ "$CONTAINER_DETAILS_RESPONSE" -ne 200 ]; then
              echo "❌ Failed to get container details (HTTP: $CONTAINER_DETAILS_RESPONSE)"
              exit 1
            fi
            
            CONTAINER_DETAILS=$(cat /tmp/container_details.json)
            CONTAINER_CONFIG=$(echo "$CONTAINER_DETAILS" | jq '.Config')
            HOST_CONFIG=$(echo "$CONTAINER_DETAILS" | jq '.HostConfig')
            NETWORK_SETTINGS=$(echo "$CONTAINER_DETAILS" | jq '.NetworkSettings')
            CONTAINER_NAME=$(echo "$CONTAINER_DETAILS" | jq -r '.Name' | sed 's|^/||')
            
            echo "✅ Container configuration retrieved"
            echo "Container name: $CONTAINER_NAME"
            
            # Step 2: Stop container
            echo "🛑 Step 2: Stopping container..."
            STOP_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/stop_response.json -X POST \
              "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/$CONTAINER_ID/stop?t=30" \
              -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
            
            echo "Stop HTTP Code: $STOP_RESPONSE"
            
            # Step 3: Remove container
            echo "🗑️ Step 3: Removing container..."
            REMOVE_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/remove_response.json -X DELETE \
              "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/$CONTAINER_ID?v=1" \
              -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
            
            echo "Remove HTTP Code: $REMOVE_RESPONSE"
            
            if [ "$REMOVE_RESPONSE" -ge 200 ] && [ "$REMOVE_RESPONSE" -lt 300 ]; then
              echo "✅ Container removed successfully"
            else
              echo "⚠️ Container remove response: $REMOVE_RESPONSE"
            fi
            
            # Step 4: Skip pull image (not needed for simple restart)
            echo "📦 Step 4: Skipping pull image - using simple restart approach"
            
            # Step 5: Update stack to recreate container
            echo "🔄 Step 5: Updating stack to recreate container..."
            
            # Get stack information
            echo "📋 Getting stack information..."
            STACKS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/stacks.json \
              "${{ secrets.PORTAINER_URL }}/api/stacks" \
              -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
            
            if [ "$STACKS_RESPONSE" -eq 200 ]; then
              # Find the vaoluoitv stack
              STACK_ID=$(cat /tmp/stacks.json | jq -r '.[] | select(.Name == "vaoluoitv") | .Id')
              
              if [ -n "$STACK_ID" ] && [ "$STACK_ID" != "null" ]; then
                echo "✅ Found stack 'vaoluoitv' with ID: $STACK_ID"
                
                # Get stack file content using /api/stacks/{id}/file
                echo "📋 Getting stack file content..."
                STACK_FILE_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/stack_file.json \
                  "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID/file" \
                  -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
                
                if [ "$STACK_FILE_RESPONSE" -eq 200 ]; then
                  STACK_FILE_CONTENT=$(cat /tmp/stack_file.json)
                  STACK_COMPOSE_FILE=$(echo "$STACK_FILE_CONTENT" | jq -r '.StackFileContent')
                  
                  echo "✅ Stack file content retrieved"
                  echo "Compose file size: $(echo "$STACK_COMPOSE_FILE" | wc -c) characters"
                  
                  # Get stack details for environment variables
                  STACK_DETAILS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/stack_details.json \
                    "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID" \
                    -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
                  
                  if [ "$STACK_DETAILS_RESPONSE" -eq 200 ]; then
                    STACK_DETAILS=$(cat /tmp/stack_details.json)
                    STACK_ENV=$(echo "$STACK_DETAILS" | jq -r '.Env // []')
                    echo "✅ Stack details retrieved for environment variables"
                  else
                    echo "⚠️ Failed to get stack details for env vars, using empty env"
                    STACK_ENV="[]"
                  fi
                  
                  # Create update payload according to tested format
                  UPDATE_PAYLOAD=$(jq -n \
                    --arg stackFileContent "$STACK_COMPOSE_FILE" \
                    '{
                      "StackFileContent": $stackFileContent,
                      "Prune": false,
                      "PullImage": true,
                      "Recreate": true
                    }')
                  
                  echo "$UPDATE_PAYLOAD" > /tmp/update_payload.json
                  
                  # Update stack using PUT /api/stacks/{id}?endpointId={endpointId}
                  echo "🔄 Updating stack using PUT API..."
                  UPDATE_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/update_response.json -X PUT \
                    "${{ secrets.PORTAINER_URL }}/api/stacks/$STACK_ID?endpointId=${{ secrets.PORTAINER_ENDPOINT_ID }}" \
                    -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}" \
                    -H "Content-Type: application/json" \
                    -d @/tmp/update_payload.json)
                  
                  echo "Stack Update HTTP Code: $UPDATE_RESPONSE"
                  
                  if [ "$UPDATE_RESPONSE" -ge 200 ] && [ "$UPDATE_RESPONSE" -lt 300 ]; then
                    echo "✅ Stack updated successfully - containers will be recreated with latest images"
                    echo "🎉 Stack update completed successfully!"
                  else
                    echo "❌ Stack update failed (HTTP: $UPDATE_RESPONSE)"
                    echo "Response:"
                    cat /tmp/update_response.json 2>/dev/null || echo "No response body"
                  fi
                else
                  echo "⚠️ Failed to get stack file content (HTTP: $STACK_FILE_RESPONSE)"
                fi
              else
                echo "⚠️ Stack 'vaoluoitv' not found"
              fi
            else
              echo "⚠️ Failed to get stacks list (HTTP: $STACKS_RESPONSE)"
            fi
          
          # Wait and check final status
          echo ""
          echo "⏳ Waiting for container to be ready..."
          sleep 10
          
          # Check final container status
          echo "🔍 Checking final container status..."
          FINAL_CONTAINERS_RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/final_containers.json \
            "${{ secrets.PORTAINER_URL }}/api/endpoints/${{ secrets.PORTAINER_ENDPOINT_ID }}/docker/containers/json?all=true" \
            -H "X-API-Key: ${{ secrets.PORTAINER_API_KEY }}")
          
          if [ "$FINAL_CONTAINERS_RESPONSE" -eq 200 ]; then
            FINAL_CONTAINERS_JSON=$(cat /tmp/final_containers.json)
            echo "📊 Final container status:"
            echo "$FINAL_CONTAINERS_JSON" | jq -r ".[] | select(.Names[] | contains(\"$CONTAINER_PATTERN\")) | {Names: .Names, State: .State, Image: .Image}" 2>/dev/null || echo "Failed to parse final container status"
          fi
          
          echo ""
          echo "🎉 Upload service redeploy test completed!"

