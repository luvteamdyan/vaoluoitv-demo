version: '3.8'

services:
  deploy-agent:
    image: dyanle/deploy-agent:latest
    environment:
      - AGENT_TOKEN=${AGENT_TOKEN:-super-secret-token}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Use non-root user with docker group access
    # Note: Docker group GID may vary by system (usually 999 or 998)
    group_add:
      - "999"  # Docker group GID - adjust if needed for your system
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5555/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.deploy-agent-http.rule=Host(`deploy-agent.vaoluoitv.com`)"
        - "traefik.http.routers.deploy-agent-http.entrypoints=web"
        - "traefik.http.routers.deploy-agent-http.middlewares=redirect-to-https"
        - "traefik.http.routers.deploy-agent-https.rule=Host(`deploy-agent.vaoluoitv.com`)"
        - "traefik.http.routers.deploy-agent-https.entrypoints=websecure"
        - "traefik.http.routers.deploy-agent-https.tls.certresolver=cloudflare"
        - "traefik.http.services.deploy-agent.loadbalancer.server.port=5555"
        - "traefik.docker.network=traefik-shared"
        - "traefik.http.services.deploy-agent.loadbalancer.healthcheck.path=/health"
        - "traefik.http.services.deploy-agent.loadbalancer.healthcheck.interval=30s"
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
      rollback_config:
        parallelism: 1
        delay: 5s
        monitor: 60s
        max_failure_ratio: 0.3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
        reservations:
          memory: 64M
          cpus: "0.1"
    networks:
      - traefik-shared

networks:
  traefik-shared:
    external: true
